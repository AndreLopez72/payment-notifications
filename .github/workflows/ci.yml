name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mule-build-and-test:
    name: Mule build and MUnit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run MUnit
        working-directory: practical
        run: mvn --batch-mode --no-transfer-progress clean verify

  terraform-validation:
    name: Terraform format and validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Check formatting
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Initialize without a backend
        working-directory: infra
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        working-directory: infra
        run: terraform validate -no-color

  dependency-review:
    name: Dependency vulnerability review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4

  codeql:
    name: CodeQL Java analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java

      - name: Build Mule Java sources
        working-directory: practical
        run: mvn --batch-mode --no-transfer-progress -DskipTests compile

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v4
