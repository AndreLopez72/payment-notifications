name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mule-build-and-test:
    name: Mule build and MUnit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run MUnit
        working-directory: practical
        run: mvn --batch-mode --no-transfer-progress clean verify

  terraform-validation:
    name: Terraform format and validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Check formatting
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Initialize without a backend
        working-directory: infra
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        working-directory: infra
        run: terraform validate -no-color

  contract-validation:
    name: API contract validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Lint OpenAPI contract
        env:
          REDOCLY_TELEMETRY: 'off'
        run: npx --yes @redocly/cli@2.62.1 lint docs/api/webhooks.openapi.yaml

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Validate JSON Schema metaschema
        run: |
          python -m pip install --disable-pip-version-check check-jsonschema==0.39.0
          check-jsonschema --check-metaschema docs/api/events/premium-payment.schema.json

  secret-scanning:
    name: Scan changed commits for secrets
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan changed commits without credential verification
        uses: trufflesecurity/trufflehog@d232362a64a09a9e7d58267b8f5acef00ae90e23 # v3.100.0
        with:
          version: 3.100.0
          extra_args: --no-verification --results=unverified

  dependency-review:
    name: Dependency vulnerability review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4

  codeql:
    name: CodeQL Java analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java

      - name: Build Mule Java sources
        working-directory: practical
        run: mvn --batch-mode --no-transfer-progress -DskipTests compile

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v4
